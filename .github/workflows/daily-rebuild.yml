name: Daily rebuild

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape sources and rebuild index.html
        run: python scraper.py

      - name: Commit if changed
        run: |
          git config user.name "kitchen-car-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
